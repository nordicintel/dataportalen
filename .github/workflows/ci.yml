# This workflow NEVER publishes anything. It runs on every push and pull
# request, builds the distributions to prove they build, and stops there.
# Releasing is a separate workflow gated on a published GitHub Release:
# see .github/workflows/release.yml.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # No DATAPORTAL_LIVE here: CI must not fail because the registry is
      # down or its nightly harvest changed the data. Live tests run in
      # live.yml on a schedule.
      - name: Test (offline, against recorded fixtures)
        run: python -m pytest tests -q

      - name: Lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes src/dataportal_se tests tools

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Confirm the wheel imports cleanly
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --quiet dist/*.whl
          /tmp/check/bin/python -c "import dataportal_se; print(dataportal_se.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 7
