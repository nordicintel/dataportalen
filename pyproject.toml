[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataportalen"
dynamic = ["version"]
description = "dataportal.se as plain Python dicts: DCAT-AP-SE metadata with vocabulary URIs resolved to labels"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nordic Intel" }]
keywords = ["dataportal", "dcat", "dcat-ap-se", "rdf", "entrystore", "open-data", "sweden"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/nordicintel/dataportalen"
Documentation = "https://github.com/nordicintel/dataportalen/blob/main/docs/guide.md"
Changelog = "https://github.com/nordicintel/dataportalen/blob/main/CHANGELOG.md"
Issues = "https://github.com/nordicintel/dataportalen/issues"

# Single source of truth, read here and by the User-Agent in core.py
[tool.hatch.version]
path = "src/dataportalen/core.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dataportalen"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "docs", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live admin.dataportal.se API"]
